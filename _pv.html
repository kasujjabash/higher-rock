<!doctype html><html><head><style>html,body{margin:0}#f{border:0}</style></head>
<body><iframe id="f" src="/_probe.html"></iframe>
<script>
var q=new URLSearchParams(location.search);var f=document.getElementById('f');
f.style.width=(q.get('w')||390)+'px';f.style.height=(q.get('h')||844)+'px';
var n=0,t=setInterval(function(){n++;try{var d=f.contentDocument;
if(d&&d.title.indexOf('VW:')===0){document.title=d.title;clearInterval(t)}
else if(n>60){document.title='GAVEUP';clearInterval(t)}}catch(e){document.title='ERR '+e.message;clearInterval(t)}},100);
</script></body></html>
