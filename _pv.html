<!doctype html><html><head><style>html,body{margin:0}#f{border:0;width:390px;height:844px}</style></head>
<body><iframe id="f" src="/_probe.html"></iframe>
<script>
var n=0;
var t=setInterval(function(){
  n++;
  try{ var d=document.getElementById('f').contentDocument;
    if(d && d.title.indexOf('VW:')===0){ document.title=d.title; clearInterval(t);} 
    else if(n>40){ document.title='GAVEUP inner='+(d?d.title:'null'); clearInterval(t);} }
  catch(e){ document.title='ERR '+e.message; clearInterval(t); }
},100);
</script></body></html>
